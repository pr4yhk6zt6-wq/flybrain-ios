name: FlyBrain
options:
  bundleIdPrefix: ai.flywire.demo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # XcodeGen 2.46 defaults to project format 77, which only Xcode 16 can open.
  # Pin the classic format so the project builds on any Xcode from 14 onwards.
  objectVersion: 56
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Unsigned build: the .ipa is meant for sideloading, which re-signs anyway.
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    MTL_FAST_MATH: YES

targets:
  FlyBrain:
    type: application
    platform: iOS
    sources:
      - path: FlyBrain/Sources
      - path: FlyBrain/Shaders
      - path: FlyBrain/Resources/Assets.xcassets
      - path: FlyBrain/Resources
        buildPhase: resources
        excludes: ["Assets.xcassets", "Assets.xcassets/**"]
        optional: true
      # The recorded world: world.json, fly.bin and frames.bin, generated by
      # tools/step4_world.py and copied here by tools/pack_world.py. A folder
      # reference, so it is copied as a directory and the three files stay
      # together whatever their names turn out to be.
      - path: FlyBrain/World
        buildPhase: resources
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.flywire.demo.flybrain
        PRODUCT_NAME: FlyBrain
        INFOPLIST_FILE: FlyBrain/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Metal needs a real GPU feature set; the brain also needs the memory.
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FlyBrain/Info.plist
      properties:
        CFBundleDisplayName: FlyBrain
        CFBundleShortVersionString: "0.6"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, metal]
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          FlyBrain uses the rear camera as the fruit fly's eyes. Each frame is
          resampled directly into the 2,784 retina cells of the BANC v888
          connectome (1,372 in the left eye, 1,412 in the right). Video never
          leaves the device and is never recorded.
        NSMicrophoneUsageDescription: >-
          Optionally used as the fly's auditory input, driving the antennal
          mechanosensory neurons. Audio never leaves the device.

  FlyBrainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlyBrainTests
    dependencies:
      - target: FlyBrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.flywire.demo.flybrain.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FlyBrain:
    build:
      targets:
        FlyBrain: all
        FlyBrainTests: [test]
    test:
      targets:
        - FlyBrainTests
      gatherCoverageData: false
