name: Build FlyBrain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS, Xcode)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the BANC download
        id: banc-cache
        uses: actions/cache@v4
        with:
          path: data/banc
          key: banc-888-v1

      - name: Download BANC v888 (brain + ventral nerve cord)
        if: steps.banc-cache.outputs.cache-hit != 'true'
        run: bash tools/download_banc.sh

      - name: Cache the flybody assets
        id: flybody-cache
        uses: actions/cache@v4
        with:
          path: data/flybody
          key: flybody-assets-v1

      - name: Build the connectome binary
        run: |
          python3 -m pip install --quiet numpy pandas pyarrow
          python3 tools/build_banc.py --raw data/banc --out build/flybanc.bin \
                                      --min-syn 3 --conduction-speed 0.25
          mkdir -p FlyBrain/Resources
          cp build/flybanc.bin build/flybanc_meta.json FlyBrain/Resources/
          ls -lh FlyBrain/Resources/

      - name: Build the fly body mesh
        run: |
          python3 tools/build_flymodel.py --cache data/flybody \
                                          --out build/flymodel.bin \
                                          --budget 110000
          cp build/flymodel.bin FlyBrain/Resources/
          ls -lh FlyBrain/Resources/

      - name: Validate the connectome
        run: python3 tools/verify_banc.py --ms 120 --gain 12 --drive 1.5

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          grep -m1 objectVersion FlyBrain.xcodeproj/project.pbxproj
          xcodebuild -list -project FlyBrain.xcodeproj

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || \
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run the test suite
        run: |
          set -o pipefail
          xcrun simctl list devices available
          DEST=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -1)
          test -n "$DEST" || { echo "no simulator available"; exit 1; }
          echo "testing on simulator $DEST"
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned for device
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/FlyBrain.app"
          test -d "$APP" || { echo "no .app at $APP"; find build/dd -name '*.app'; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry FlyBrain-unsigned.ipa Payload
          ls -lh FlyBrain-unsigned.ipa
          unzip -l FlyBrain-unsigned.ipa | tail -5

      # A missing flymodel.bin does not fail the build, it fails the ANIMAL:
      # FlyModel throws, the renderer draws the room and skips the fly, and the
      # symptom is a screenshot of an empty world. That slipped through for two
      # commits because nothing checked. Check it here.
      - name: The .ipa must contain the fly
        run: |
          cd build
          unzip -l FlyBrain-unsigned.ipa | grep -q 'FlyBrain.app/flymodel\.bin' \
            || { echo "flymodel.bin is NOT in the .ipa — the fly will not be drawn"; \
                 unzip -l FlyBrain-unsigned.ipa | grep -E '\.bin|\.json'; exit 1; }
          unzip -l FlyBrain-unsigned.ipa | grep -q 'FlyBrain.app/flybanc\.bin' \
            || { echo "flybanc.bin is NOT in the .ipa"; exit 1; }
          echo "both data assets present"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-unsigned-ipa
          path: build/FlyBrain-unsigned.ipa
          if-no-files-found: error

      - name: Upload the connectome binary
        uses: actions/upload-artifact@v4
        with:
          name: flybanc-connectome
          path: |
            build/flybanc.bin
            build/flybanc_meta.json
            build/flymodel.bin
            build/flymodel_meta.json
