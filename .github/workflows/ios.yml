name: Build FlyBrain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS, Xcode)
    runs-on: macos-15
    # Step 3 runs ~20 minutes of nerve cord and ~20 minutes of physics on top
    # of the build, because it is an experiment and not a unit test.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      # ---------------------------------------------------------------- data
      - name: Cache BANC v888
        id: banc-cache
        uses: actions/cache@v4
        with:
          path: data/banc
          key: banc-888-v1

      - name: Download BANC v888 (brain + ventral nerve cord)
        if: steps.banc-cache.outputs.cache-hit != 'true'
        run: bash tools/download_banc.sh

      - name: Cache the flybody model
        id: flybody-cache
        uses: actions/cache@v4
        with:
          path: data/flybody
          key: flybody-main-v1

      - name: Download the flybody body model
        if: steps.flybody-cache.outputs.cache-hit != 'true'
        run: bash tools/download_flybody.sh

      # ------------------------------------------------------- step 1: body
      # The anatomy inventory is the ground truth every later step is written
      # against, so it runs BEFORE the app build and its failure fails the run.
      - name: Step 1 — anatomy inventory (body + nerve structure)
        run: python3 tools/step1_anatomy.py

      - name: Step 1 — assert the anatomy matches the published animal
        run: |
          python3 - <<'PY'
          import json, sys
          a = json.load(open('build/fly_anatomy.json'))
          c = a['counts']
          checks = [
              ('body parts',          c['parts'],              67),
              ('articulated joints',  c['joints_articulated'], 102),
              ('articulated DOF',     c['dof_articulated'],    102),
              ('actuators',           c['actuators'],          78),
              ('adhesion actuators',  sum(1 for x in a['actuators']
                                          if x['name'].startswith('adhere_')), 8),
          ]
          ok = True
          for label, got, want in checks:
              flag = 'ok ' if got == want else 'FAIL'
              if got != want: ok = False
              print(f'  {flag} {label:22s} {got}  (expected {want})')
          mass = a['mass_total_kg'] * 1e6
          if not (0.8 < mass < 1.2):
              print(f'  FAIL mass {mass:.3f} mg is not a fruit fly'); ok = False
          else:
              print(f'  ok  mass                   {mass:.3f} mg')
          length = a['size']['body_length_mm']
          if not (2.0 < length < 3.5):
              print(f'  FAIL trunk length {length:.2f} mm is not a fruit fly'); ok = False
          else:
              print(f'  ok  trunk length           {length:.2f} mm')
          sys.exit(0 if ok else 1)
          PY

      # ----------------------------------------------------- step 1: physics
      - name: Step 1 — the fly stands on its own six feet
        run: python3 tools/step1_sim.py --seconds 3.0 --json reports/step1_stand.json

      # ------------------------------------------------------ step 2: reflex
      # The exact command docs/STEP2.md documents, so CI reproduces the numbers
      # the write-up quotes. The probe is report-only on the reflex DIRECTION —
      # that is state-dependent in the real animal too, and step 2 reports the
      # condition under which it flips rather than hiding it. It fails the build
      # only if the connectome stops containing the pathway, or if the corrected
      # sign regresses to the old, wrong one.
      - name: Step 2 — the leg reflex, out of the connectome
        run: |
          python3 tools/step2_legcircuit.py --leg front_leg --side left --hops 3
          python3 tools/step2_reflex.py --leg front_leg --side left --ms 700 --desc 2.5 --stim 3.0

      - name: Step 2 — the pathway must be present in the connectome
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open('reports/step2_reflex.json'))
          checks = [
              ('chordotonal organ found', r['organs'].get('chordotonal', 0) > 20),
              ('tibia flexor pool found', r['pools'].get('tibia flexor', 0) > 5),
              ('an arc exists out of the organ', len(r['chordotonal_arcs']) > 0),
              ('a disynaptic route to the flexor exists',
               r['disynaptic'].get('tibia flexor', {}).get('arcs', 0) > 0),
              ('the tibia routes are reached through interneurons',
               r['disynaptic'].get('tibia flexor', {}).get('interneurons', 0) > 0),
              # the bug behind commit 7b22dd1: the table was computed against
              # the wrong neurons and came out positive. Guard the corrected sign.
              ('the tibia flexor pathway is net inhibitory (corrected sign)',
               r['disynaptic']['tibia flexor']['net_weight'] < -20000),
              # published anatomy, reproduced in the connectome (docs/STEP2.md §2)
              ('no direct chordotonal path to a tibia motor neuron (Azevedo 2020)',
               r['monosynaptic']['chordotonal']['tibia flexor']['arcs'] == 0),
              ('a direct campaniform path to the flexor (Phelps 2021)',
               r['monosynaptic']['campaniform']['tibia flexor']['arcs'] >= 1),
              # the failure this step fixed: the network used to be silent
              ('the standing fly has an active nerve cord',
               r['runs']['standing']['_population_hz'] > 1.0),
              ('the answer is reported across scales, not at one',
               len(r['scale_sweep']) >= 2 and 'control_sign_shuffled' in r),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          top = r['chordotonal_arcs'][0]['cell']
          print(f"  strongest organ target: {top}")
          sys.exit(0 if ok else 1)
          PY

      # ------------------------------------------------------ step 3: the loop
      # The exact command docs/STEP3.md documents, so CI reproduces the numbers
      # the write-up quotes. It fails the build if the animal stops standing
      # with one leg under cord control. It does NOT assert the direction of
      # the reflex: that is the result, it is state-dependent in the real
      # animal, and step 2 already declined to claim it. What is asserted is
      # that the measurement exists, at more than one load, in both
      # directions, and across every parameter this step had to choose.
      - name: Step 3 — close the loop, cord to muscle to joint to sense organ
        run: |
          python3 tools/step3_closedloop.py --leg front_leg --side left \
                                            --plot docs/img/step3_loop.png

      - name: Step 3 — the loop must close, and the reflex must be measured
        run: |
          python3 - <<'PY'
          import json, sys

          r = json.load(open('reports/step3_closedloop.json'))
          s, idx, driven = r['standing'], r['reflex_index'], r['driven']
          loads = sorted({v['load_body_weights'] for v in idx.values()})
          dirs = sorted({v['direction'] for v in idx.values()})
          force = [v['force_ref'] for v in r['reference'].values()]

          # Two rows of the polarity control, identical in every respect except
          # the sign of one published biological fact. If they agree, the organ
          # is not reaching the loop and nothing below means anything.
          pol = list(r['polarity_control'].values())
          spread = sum(abs(pol[0][d]['reflex_index'] - pol[1][d]['reflex_index'])
                       for d in ('extension', 'flexion'))

          checks = [
              ('the animal stands with one leg under cord control',
               s['standing']),
              ('the body does not sink once it has settled',
               abs(s['com_z_mm_change_second_half']) < 0.10),
              ('most of the feet are still on the floor',
               s['foot_contacts_mean'] >= 4.0),
              ('every driven joint is commanded by both of its antagonists',
               all(driven[j]['+1'] and driven[j]['-1'] for j in driven)),
              ('the flexion and extension directions were measured, not assumed',
               all('flexion' in r['joints'][j] and 'extension' in r['joints'][j]
                   for j in driven)),
              ('the reflex is measured in both directions',
               dirs == ['extension', 'flexion']),
              ('the reflex is measured at more than one load', len(loads) >= 2),
              ('adding load actually loads the leg', max(force) > 1.5 * min(force)),
              ('the load question is asked again where the reflex is readable',
               len(r['reflex_index_at_switch_kappa']) >= 2),
              ('the organ gain is swept, not chosen', len(r['kappa_sweep']) >= 2),
              ('the muscle filter is swept, not chosen',
               len(r['tau_muscle_sweep']) >= 2),
              ('the polarity of the organ is tested, not assumed',
               len(r['polarity_control']) == 2),
              ('reversing that polarity changes what the loop does', spread > 0.02),
              ("step 2's synaptic scale is swept, not chosen",
               len(r['scale_sweep']) >= 2),
              ('every pool is either placed on a joint or listed as not driven',
               len(r['pool_placement']) + len(r['pools_not_driven']) >= 7),
          ]

          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)

          # What was measured. Deliberately no assertion about the *direction*
          # of the reflex: that is a finding, and a finding is not a test.
          for tag, block in (("kappa = 1", idx),
                             ("kappa = 4", r['reflex_index_at_switch_kappa'])):
              for v in block.values():
                  print(f"  {tag} {v['load_body_weights']:g} W "
                        f"{v['direction']:9s} rho {v['reflex_index']:+.3f} "
                        f"+- {v['reflex_index_sem']:.3f} ({v['verdict']}"
                        f"{'' if v['resolved'] else ', below the noise'})")
          for k, row in r['polarity_control'].items():
              print(f"  {k}: " + ", ".join(
                  f"{d} {row[d]['reflex_index']:+.3f}" for d in row))
          sys.exit(0 if ok else 1)
          PY

      # -------------------------------------------------------------- step 4
      # Steps 1 to 3 progressively handed the animal over to its own nervous
      # system. Step 4 drives all six legs and then does the thing the other
      # three could not: it lets you look at it. This runs a short recording
      # (the real one is minutes long) and asserts the recording exists and
      # that the animal is standing in it. It asserts nothing about whether
      # the animal walks: with six independent cords and no coordination
      # between them, the honest expectation is that it stands, and finding
      # out is the point of publishing the recording rather than a test.
      # The long recording, not a short one: reports/step4_world.md is
      # committed, and the world packed into the .ipa has to be the animal
      # the report describes — seven seconds, two pushes, 0.56 units of
      # travel — rather than a shorter run that quietly rewrites it.
      - name: Step 4 — the whole animal, six legs, in a world
        run: |
          python3 tools/step4_world.py --ms 7000 --pre-ms 600 \
            --nudge 2600 --nudge 5600 --nudge-force 0.6 --nudge-ms 120 \
            --seed 7

      - name: Step 4 — the recording must exist, and the animal must be in it
        run: |
          python3 - <<'PY'
          import json, sys, pathlib

          r = json.load(open('reports/step4_world.json'))
          b = r['behaviour']
          frames = pathlib.Path('world/frames.bin')
          body = pathlib.Path('world/fly.bin')
          npart = r['frames']['parts']

          checks = [
              ('all six legs are driven by their own cord', len(r['legs']) == 6),
              ('the animal is standing in the recording',
               b['foot_contacts_mean'] >= 4.0),
              ('it did not fall over', not b['fell_over']),
              ('the body geometry was written',
               body.exists() and body.stat().st_size > 1_000_000),
              ("the model's own meshes survived the packing",
               r['body_geometry']['n_face'] > 100_000),
              ('the recording has frames in it', r['frames']['n'] > 10),
              ('the frame file is exactly the size the manifest says',
               frames.stat().st_size
               == r['frames']['n'] * npart * 7 * 4),
              ('every visible part is posed in every frame', npart >= 60),
              ("the animal's stance was solved for all six legs at once",
               len(r['stance']['leg_force']) == 6),
              ("the world's push is recorded rather than hidden",
               len(r['model']['nudges_ms']) >= 1),
              ('every leg carries some of the weight',
               all(v > 0 for v in r['stance']['leg_force'].values())),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          print(f"  net displacement {b['net_displacement']:.4f} units "
                f"({b['net_displacement']/0.27:.2f} body lengths), "
                f"{b['foot_contacts_mean']:.1f} of 6 feet down, "
                f"fell over: {b['fell_over']}")
          sys.exit(0 if ok else 1)
          PY

      # ------------------------------------------------- step 5: the body, live
      # The solver the phone runs, written in NumPy first so it can be checked
      # against MuJoCo before a line of Swift exists. Three checks, and all
      # three have to pass: forward kinematics against mj_forward to 1e-15
      # (that one is a frame convention, not a tolerance question); twenty
      # milliseconds of free fall against MuJoCo stepping the same model with
      # the same 100 us integrator; and the animal standing for three seconds
      # on its own six feet, on muscles and a floor and nothing else.
      #
      # Then the golden trace, which is what the Swift port is pinned to. The
      # body asset is rebuilt first: a json field the solver reads is silently
      # inert when it is absent, so every number below is stale until it is.
      # The camera's limits are a property of the animal, not of the source: at
      # 0.22 cm the body of this fly spans 2.9 screens and only 29.7% of it is
      # inside the frustum, which is the screenshot IMG_2715 was reporting as
      # "the model is in pieces" while the model was fine. The limits are
      # measured here, from the world this run just wrote, and packed into the
      # app's world.json by tools/pack_world.py later in this file.
      - name: Step 4 — measure how close the camera may come, from the animal
        run: python3 tools/measure_view.py --sample 25 --write

      # And then look: pose the animal the way FlyWorld.apply does, put the
      # app's own cameras where WorldRig puts them, and fail unless every one
      # of them frames the body of the animal. The eye panes in that same
      # screenshot were correct — a fly standing on a grid — which is why this
      # is a camera check and not a model check.
      - name: Step 4 — every camera must frame the animal, above the floor
        run: python3 tools/audit_view.py --gate --out build/view

      # And the rule has to have teeth: with the tilt rule this replaced — a
      # flat ±83° with the distance ignored — the lens reaches 2.4 cm *below*
      # the floor plane, where the scene draws the floor unlit and the view
      # greys out. uploads/IMG_2715.png is what that looks like from the
      # outside ("the background is sometimes grey, sometimes white"), so this
      # step requires the old rule to fail rather than asserting it would.
      - name: Step 4 — the old tilt rule must let the lens under the floor
        run: |
          if python3 tools/audit_view.py --gate --old-tilt --out build/view_old; then
            echo "FAIL the gate passed the old tilt rule, which put the lens"
            echo "     2.4 cm below the floor plane (uploads/IMG_2715.png)"
            exit 1
          fi
          echo "the old tilt rule failed the gate, as it has to"

      - name: Step 5 — rebuild the body asset
        run: |
          python3 tools/build_body.py --flybody data/flybody \
            --out build/fly_body.json --meshes build/fly_meshes.bin

      # The stance the phone uses is measured by *standing the animal up in the
      # solver the phone runs*: build_body.py reads it off MuJoCo's soft
      # contacts, and a stance is only a stance for the floor it was measured
      # on. This rewrites stance_q, stance_root_z and the stance excitation in
      # place, so everything after it — the checks, the golden trace, the app
      # bundle — is measured against the same animal the app will run.
      - name: Step 5 — measure the stance by standing in this solver
        run: python3 tools/stand_body.py --body build/fly_body.json --ms 600

      - name: Step 5 — the solver against MuJoCo, and the animal standing
        run: |
          python3 tools/fly_aba.py --verify \
            --mjcf data/flybody/flybody-main/flybody/fruitfly/assets/fruitfly.xml \
            --out reports/step5_aba.json

      - name: Step 5 — the golden trace the Swift solver must reproduce
        run: python3 tools/fly_aba.py --golden build/fly_golden.json

      - name: Step 5 — read the report and fail if anything is wrong with it
        run: |
          python3 - <<'PY'
          import json, sys

          r = json.load(open('reports/step5_aba.json'))
          k, d, st = r['kinematics'], r['dynamics'], r['standing']
          checks = [
              ('forward kinematics match mj_forward', k['ok']),
              ('the first step of free fall matches MuJoCo', d['ok']),
              ('body positions stay put in free fall', d['xpos'] < 1e-4),
              ('the centre of mass stays put in free fall', d['com'] < 1e-6),
              ('the animal stands on its own muscles', st['ok']),
              ('no joint ran away', st['worst_joint_rate'] < 60),
              ('the floor carries the animal weight',
               0.8 <= st['support_over_weight_last_half'] <= 1.2),
              ('the feet are down', st['feet_on_floor_mean'] >= 5.0),
              ('it does not sink or lift while it stands',
               st['com_z_sd_last_half'] < 0.01),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          print(f"  standing: COM z {st['com_z_first']:+.5f} -> "
                f"{st['com_z_last']:+.5f} cm, drift {st['drift_cm']:.4f} cm, "
                f"support/weight {st['support_over_weight_last_half']:.3f}")
          sys.exit(0 if ok else 1)
          PY

      # Every mesh the app draws is positioned by the asset's own `visual`
      # table. This checks that table against the model it was read out of —
      # `pos`, `quat`, and which body each part belongs to — because the screen
      # is the only place a mistake in it would otherwise show up.
      - name: Step 5 — every drawn part must sit where the model puts it
        run: python3 tools/audit_meshes.py

      - name: Step 5 — pack the body into the app bundle
        run: |
          rm -f FlyBrain/World/fly_body.json
          python3 tools/pack_body.py
          ls -lh FlyBrain/World/

      # -------------------------------------------------------------- the app
      - name: Build the connectome binary for the app
        run: |
          python3 tools/build_banc.py --raw data/banc --out build/flybanc.bin \
                                      --min-syn 3 --conduction-speed 0.25
          python3 tools/verify_banc.py --ms 120 --gain 12 --drive 1.5
          # The app has to run at the operating point that was measured, and
          # the two numbers live in different languages — so the one that can
          # be checked is checked here rather than trusted.
          grep -q 'var gain: Float = 12' FlyBrain/Sources/SimulationEngine.swift \
            || { echo "the app's default synaptic gain is not the 12 CI validates at"; exit 1; }
          mkdir -p FlyBrain/Resources
          cp build/flybanc.bin build/flybanc_meta.json FlyBrain/Resources/
          cp build/fly_anatomy.json FlyBrain/Resources/
          ls -lh FlyBrain/Resources/

      # ---------------------------------------------------------- step 4: the smell
      # These three run here and not with the rest of step 4 because they are the
      # only step-4 checks that read the packed connectome (the `--probe` in the
      # gate loads build/flybanc.bin). Placed before the pack, the gate fails on a
      # missing file rather than on a wrong smell -- which is how this was found.
      # Item 11: odor as a spatial and temporal field. The field is written into
      # world.json (the app reads it from there, like the camera limits), and the
      # golden samples are the numbers `FlyBrainTests/OdorFieldTests` pins the
      # Swift port to.
      - name: Step 4 — the odor field, written where the app reads it
        run: |
          python3 tools/odor_field.py --write --golden build/odor_golden.json

      # The gate is not "the file exists". It is: the mean falls with distance
      # and does not reach upwind; an antenna in it is in clean air most of the
      # time (that is what makes it a plume and not a cloud); and — the claim
      # item 11 actually makes — driving the olfactory receptor neurons from it
      # moves the brain, not just the antenna. The first rehearsal of this gate
      # (a drive below the LIF's threshold) left the receptors at zero and moved
      # nothing, and passed: it now fails on exactly that.
      - name: Step 4 — the odor must be a plume, and it must reach the brain
        run: python3 tools/odor_field.py --gate

      # And the two implementations of the field — the tool's and the phone's —
      # must be the same field. The Swift test carries the golden numbers in its
      # own source (a test that reads its expectations from the tool it is
      # checking cannot fail), so what has to be checked here is that those
      # embedded numbers are still the ones this run produces.
      - name: Step 4 — the smell in the Swift test is the smell this run measured
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          golden = json.loads(pathlib.Path('build/odor_golden.json').read_text())
          want = [(round(s['point'][0], 6), round(s['point'][1], 6),
                   round(s['point'][2], 6), s['t_ms'], s['drive']) for s in golden]
          src = pathlib.Path('FlyBrainTests/OdorFieldTests.swift').read_text()
          rows = re.findall(r'\(SIMD3<Double>\(([-0-9.]+), ([-0-9.]+), ([-0-9.]+)\), '
                            r'([0-9.]+), ([-0-9.eE]+)\)', src)
          got = [(round(float(a), 6), round(float(b), 6), round(float(c), 6),
                  float(d), float(e)) for a, b, c, d, e in rows]
          if len(got) != len(want):
              print(f'FAIL the Swift test carries {len(got)} samples, the tool '
                    f'produced {len(want)}')
              sys.exit(1)
          for i, (g, w) in enumerate(zip(got, want)):
              if abs(g[4] - w[4]) > 1e-9:
                  print(f'FAIL sample {i} is {g[4]} in the test and {w[4]} in the '
                        f'tool')
                  sys.exit(1)
          print(f'the {len(want)} samples in the Swift test are the ones this run '
                f'measured')
          PY

      # Everything above built the brain. This puts the body in: the app
      # bundle is only allowed to carry what existed when xcodegen ran, so
      # the recording has to be copied in first.
      # Step 6 reads the motor pools out of the connectome as named groups, so
      # the check they are actually in the built file belongs here, next to the
      # build that puts them there -- not in the app, where a missing pool is
      # an animal that does nothing.
      # The Shader file is the one place in the app that CI can read but not
      # run, so the two numbers the kernel's own header claims are checked by
      # name: external input is added raw, and the retina scales the camera path
      # only. Both are also measured against the Python reference by
      # tools/pool_probe.py (docs/ASSUMPTIONS.md #25).
      # ------------------------------------------------------- item 7: the gyro
      # These three sit with the smell's rather than with the step-4 world
      # checks: the gate and the golden table both read build/flybanc.bin, which
      # is packed a few steps above. (Placed before the pack, this failed on a
      # missing file rather than on a wrong gyro -- the same trap the odor gate
      # fell into in run 37457864200.)
      # The haltere pair's geometry is measured from the body model itself, and
      # the measurement needs the MJCF (so: after the body is downloaded). The
      # probe needs the packed connectome (so: after it is built). Hence its
      # position here rather than with the step-6 checks that read the same bin.
      - name: Step 7 — the halteres, written where the app reads them
        run: |
          python3 tools/haltere_gyro.py --write --golden build/haltere_golden.json

      # What the gate claims: the pair is a two-axis rate sensor (yaw and roll
      # in the difference of the two halteres, pitch in their sum, leakage under
      # 1%), a rotation moves the two sensory populations of the shipped
      # connectome, and a fast turn is resolvable from them in one second. Two
      # rehearsals are part of the tool, not of this file: `--convention mirrored`
      # (the opposite stroke convention, which puts yaw in the sum channel and
      # fails) and `--drive-gain 0` (a gyro wired to nothing, which fails on the
      # pools not moving).
      - name: Step 7 — the halteres must be a gyro, and it must reach the cord
        run: python3 tools/haltere_gyro.py --gate

      # And the two implementations — the tool's and the phone's — must be the
      # same gyro. The Swift test carries the golden numbers in its own source
      # (a test that reads its expectations from the tool it is checking cannot
      # fail), so what has to be checked is that those embedded numbers are still
      # the ones this run produced.
      - name: Step 7 — the gyro in the Swift test is the gyro this run measured
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          golden = json.loads(pathlib.Path('build/haltere_golden.json').read_text())
          want = [(round(s['dps'][0], 6), round(s['dps'][1], 6), round(s['dps'][2], 6),
                   s['left'], s['right']) for s in golden]
          src = pathlib.Path('FlyBrainTests/HaltereGyroTests.swift').read_text()
          rows = re.findall(r'\(SIMD3<Double>\(([-0-9.]+), ([-0-9.]+), ([-0-9.]+)\), '
                            r'([-0-9.eE]+), ([-0-9.eE]+)\)', src)
          got = [(round(float(a), 6), round(float(b), 6), round(float(c), 6),
                  float(d), float(e)) for a, b, c, d, e in rows]
          if len(got) != len(want):
              print(f'FAIL the Swift test carries {len(got)} samples, the tool '
                    f'produced {len(want)}')
              sys.exit(1)
          for i, (g, w) in enumerate(zip(got, want)):
              if g[:3] != w[:3]:
                  print(f'FAIL sample {i} is for {g[:3]} in the test and {w[:3]} '
                        f'in the tool')
                  sys.exit(1)
              for j, name in ((3, 'left'), (4, 'right')):
                  if abs(g[j] - w[j]) > 1e-9:
                      print(f'FAIL sample {i} {name} drive is {g[j]} in the test '
                            f'and {w[j]} in the tool')
                      sys.exit(1)
          print(f'the {len(want)} samples in the Swift test are the ones this run '
                f'measured')
          PY

      # The wings: the force model, measured out of the body model and driven
      # through the cord, with `--write` putting the whole of it — the measured
      # geometry, the lift directions, the beat's constants and the four pools'
      # own reference rates — into `world.json` for the app to read.
      #
      # `--probe` drives the four wing motor pools through the shipped
      # connectome and reads their rates back: each pool against its *own*
      # full-drive rate, because the two power pools do not run at the same rate
      # (173.7 and 212.3 Hz) and one shared reference would hold an amplitude
      # asymmetry open with no command behind it. It also measures the reflex
      # arc the connectome already contains (item 7 found the haltere afferents
      # synapsing directly onto the wing steering motor neurons): a 400 °/s yaw
      # moves those pools, which is what makes the arc a fact rather than an
      # assumption.
      - name: Step 6 — the wings, measured and written
        run: python3 tools/wing_aero.py --probe --write --golden build/wing_golden.json

      # What the gate claims: the strips add up to the wing; the two wings are
      # mirrors of each other and sweep the same way at the same joint angle;
      # the beat's flight force is the animal's weight (lift/weight 1.00) at a
      # mid-stroke angle of attack of 45° — which is what Dickinson, Lehmann &
      # Sane measured in the animal's own hovering beat; a left-right amplitude
      # asymmetry makes a yaw moment and reverses it; and the attitude the wing
      # force implies (47° nose-up when the body is level) is one a fly holds.
      - name: Step 6 — the wings must carry the animal, and an asymmetry must turn it
        run: python3 tools/wing_aero.py --gate

      # And the gate has teeth. Both rehearsals are deliberately wrong models:
      # `--convention mirrored` mirrors the right wing's stroke joint in the
      # body model, so the two wings sweep against each other; `--lift-from
      # rest_plane` pitches the wing away from the body model's rest plane
      # instead of its stroke plane, which flies the wing edge-on. Each has to
      # be caught — a gate that passes a broken model is worse than no gate.
      - name: Step 6 — the wing model's rehearsals must fail
        run: |
          set -e
          if python3 tools/wing_aero.py --gate --convention mirrored; then
            echo "FAIL the gate passed a body model whose wings sweep against each other"
            exit 1
          fi
          if python3 tools/wing_aero.py --gate --lift-from rest_plane; then
            echo "FAIL the gate passed a wing pitched away from its rest plane"
            exit 1
          fi
          echo "both rehearsals failed the gate, as they have to"

      # And the two implementations — the tool's and the phone's — must be the
      # same aerodynamics. The Swift test carries the golden rows in its own
      # source (a test that reads its expectations from the tool it is checking
      # cannot fail), so what has to be checked is that those embedded rows are
      # still the ones this run produced: the wing's geometry, the force law at
      # 25 (velocity, angle of attack) points, and nine whole beats each driven
      # by the two wings' own activations.
      - name: Step 6 — the wings in the Swift test are the wings this run measured
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          golden = json.loads(pathlib.Path('build/wing_golden.json').read_text())
          src = pathlib.Path('FlyBrain/Sources/WingAero.swift').read_text()

          def block(name):
              start = src.index(f'static let {name} = """') + len(f'static let {name} = """')
              end = src.index('"""', start)
              rows = []
              for line in src[start:end].strip().splitlines():
                  vals = [float(v) for v in line.split()]
                  if vals:
                      rows.append(vals)
              return rows

          def near(a, b, tol=1e-9):
              return abs(a - b) <= tol * max(1.0, abs(b))

          failures = []

          wing = block('goldenWing')
          g = golden['wing']
          head = wing[0]
          checks = [
              (head[1], g['area_cm2'], 'area'), (head[2], g['span_cm'], 'span'),
              (head[4], g['chord_cm'], 'chord'),
              (head[5], g['second_moment_cm4'], '∫r²dA'),
              (head[6], g['r2_hat_cm'], 'r̂₂'), (head[8], g['com_cm'], 'com'),
              (head[9], g['sin_theta'], 'sinθ'),
              (head[10], golden['attitude_deg'], 'the attitude'),
              (head[11], golden['weight_dyn'], 'the weight'),
          ]
          for got, want, what in checks:
              if not near(got, want):
                  failures.append(f'{what}: the test carries {got}, this run measured {want}')
          if len(wing) != 9:
              failures.append(f'the test carries {len(wing)} wing lines, this run '
                              f'measured a head row and four vectors for each wing (9)')
          for i, key in enumerate(['stroke_axis', 'span_axis', 'lift_dir', 'hinge_cm']):
              for j in range(3):
                  if not near(wing[i + 1][j], g[key][j]):
                      failures.append(f'{key}[{j}]: the test carries {wing[i + 1][j]}, '
                                      f'this run measured {g[key][j]}')
                  # and the right wing's own vectors: the two wings in the body
                  # model are not identical, so the right wing's rows are the
                  # right wing's, measured this run, not the left's mirrored
                  if not near(wing[i + 5][j], g['right'][key][j]):
                      failures.append(f'right {key}[{j}]: the test carries '
                                      f'{wing[i + 5][j]}, this run measured '
                                      f'{g["right"][key][j]}')

          stations_r = block('goldenStationsRight')
          want_r = g['right']['stations']
          if len(stations_r) != len(want_r):
              failures.append(f'the test carries {len(stations_r)} right-wing strips, '
                              f'this run measured {len(want_r)}')
          else:
              for i, (row, want) in enumerate(zip(stations_r, want_r)):
                  for j, key in ((0, 'r_cm'), (1, 'chord_cm'), (2, 'area_cm2')):
                      if not near(row[j], want[key]):
                          failures.append(f'right strip {i} {key}: the test carries '
                                          f'{row[j]}, this run measured {want[key]}')

          strips = block('goldenStrip')
          if len(strips) != len(golden['strip_force']):
              failures.append(f'the test carries {len(strips)} strip rows, this run '
                              f'made {len(golden["strip_force"])}')
          else:
              for i, (row, want) in enumerate(zip(strips, golden['strip_force'])):
                  for j, key in ((2, 'cl'), (3, 'cd'), (4, 'lift_dyn'), (5, 'drag_dyn')):
                      if not near(row[j], want[key]):
                          failures.append(f'strip {i} {key}: the test carries {row[j]}, '
                                          f'this run measured {want[key]}')

          beats = block('goldenBeat')
          keys = ['activation_left', 'activation_right', 'amplitude_left_deg',
                  'amplitude_right_deg', 'lift_left_dyn', 'lift_right_dyn',
                  'flight_force_dyn', 'thrust_dyn', 'vertical_dyn', 'side_dyn',
                  'yaw_moment_dyn_cm', 'roll_moment_dyn_cm', 'pitch_moment_dyn_cm',
                  'drag_cost_dyn']
          if len(beats) != len(golden['beat']):
              failures.append(f'the test carries {len(beats)} beats, this run made '
                              f'{len(golden["beat"])}')
          else:
              for i, (row, want) in enumerate(zip(beats, golden['beat'])):
                  for j, key in enumerate(keys):
                      if not near(row[j], want[key]):
                          failures.append(f'beat {i} {key}: the test carries {row[j]}, '
                                          f'this run measured {want[key]}')

          if failures:
              for f in failures:
                  print('FAIL ' + f)
              sys.exit(1)
          print(f'the Swift port carries this run\'s wing: geometry, '
                f'{len(strips)} strip rows and {len(beats)} beats')
          PY


      - name: Step 6 — the LIF kernel's external-input convention must match the reference
        run: |
          grep -q 'iSyn \* P.gain + externalInput\[gid\] + noise' FlyBrain/Shaders/LIF.metal \
            || { echo "lifIntegrate is not adding the external drive raw (ASSUMPTIONS #25)"; exit 1; }
          grep -q 'clamp(P.cameraBias + contrast, 0.0f, 4.0f)' FlyBrain/Shaders/LIF.metal \
            || { echo "the retina's documented [0,4] clamp is gone (ASSUMPTIONS #15)"; exit 1; }

      # The group tallies are the one counter that accumulates across a whole
      # frame while the harvest that reads them runs after the GPU is done. That
      # is an ordering claim, and only a dispatch inside the same command buffer
      # can make it: the memset this gate forbids ran at *encode* time, which is
      # not the time the GPU reaches the kernels, so a device that keeps its
      # queue a few frames deep can throw a frame's tallies away before anything
      # reads them. Both halves are pinned because either one alone is a bug.
      - name: Step 6 — the group tallies must be cleared on the GPU, not the CPU
        run: |
          grep -q 'if (zeroGroups != 0 && gid < groupCount) groupCounts\[gid\] = 0;' \
            FlyBrain/Shaders/LIF.metal \
            || { echo "resetCounters no longer clears the group tallies on the GPU"; exit 1; }
          if grep -q 'memset(groupCounts' FlyBrain/Sources/SimulationEngine.swift; then
            echo "SimulationEngine is clearing groupCounts from the CPU again: that"
            echo "write lands at encode time and races the GPU's accumulation."
            exit 1
          fi

      # Item 4 is the walking circuits, and it has a substrate in the dataset:
      # 788 cells in BANC v888 synapse onto the motor pools of more than one
      # leg (69,543 synapses into them), while the sense organs' own route to
      # the pools is 85:1 private to the leg it serves (this same tool's first
      # section). A gait built on the cord therefore needs those cells to still
      # be there in the packed binary — this is the gate that says so.
      - name: Step 6 — the connectome must couple the legs beyond the sense organs
        run: python3 tools/coupling_probe.py --structural-only --require-coupling

      - name: Step 6 — the motor pools must be in the connectome
        run: python3 tools/verify_pools.py

      # The loop the app closes has two ends, generated by two different tools:
      # the muscles in the body asset (build_body.py) and the pools and organs
      # in the connectome (build_banc.py). Both are asked for *by name*. This is
      # the check that they are the same names, on the files the app will carry.
      - name: Step 6 — both ends of the loop must exist, and by the same names
        run: python3 tools/verify_loop.py

      # Item 12: the leg's touch organ is a sense organ only if it is (a) in the
      # connectome the app loads, (b) populated, and (c) able to reach a motor
      # neuron — a group that reads as silence is the failure mode this project
      # refuses to hide behind. The tool also runs one footfall through the
      # reference LIF and prints what the leg's pools do, so the numbers in
      # reports/item12_touch.md are regenerated rather than quoted.
      - name: Item 12 — every leg's tactile organ must reach the motor pools
        run: python3 tools/tactile_probe.py --gate

      # The tone the cord runs on is the brain's, and FlyCord puts it on the
      # descending population — where tools/step3_closedloop.py puts it. That is
      # only a wiring claim until it is measured in the binary the app carries:
      # the descending cells have to synapse onto the motor neurons the pool
      # groups are made of, leg by leg. Reads build/flybanc.bin.
      - name: Step 6 — the descending cells must reach the legs' motor pools
        run: python3 tools/verify_descending.py

      # The loop exists three times — the step-3 reference, the walk loop with
      # the body in it, and FlyCord.swift, which is what the animal runs. Three
      # transliterations of one law drift, and the drift is invisible: it has
      # already happened twice (the pool names, and the four-times-too-small
      # rates). This is the method that replaces reading two files side by side
      # — it reads the constants out of all three files and fails on any
      # disagreement, and it fails if either organ law stops naming its κ.
      - name: Step 6 — the cord's laws must be one set of numbers in all three files
        run: python3 tools/check_cord_laws.py --explain

      # The 788 multi-leg premotor cells, split by which legs each one reaches.
      # This is the measurement item 4 turns on (reports/item4_walking.md §9):
      # if the cells that reach one tripod are not separable from those that
      # reach the other, no pattern on that population can alternate anything.
      # The tool re-derives the split from the graph, the other way round from
      # the packer, and fails unless the two agree cell for cell and the nine
      # groups partition every cell that reaches a pool motor neuron.
      - name: Step 6 — the premotor split must partition the cells that reach a pool
        run: |
          python3 tools/verify_premotor.py
          # And the muscle axis has to keep the shape the experiment in
          # reports/item4_walking.md §10 measured: the populations that reach
          # these ten muscles, and the two of them whose net command to the two
          # tripods is most opposed. A group that silently disappears reads as
          # 0 Hz in the app, which is indistinguishable from a quiet one.
          python3 tools/premotor_axis.py --json reports/premotor_axis.json > /dev/null
          python3 - <<'PY'
          import json, sys
          r = json.load(open('reports/premotor_axis.json'))
          mus = {row['muscle']: row for row in r['muscle']}
          missing = [m for m in ('long_tendon', 'coxa_rotator_ant',
                                 'tarsus_depressor', 'tibia_extensor',
                                 'femur_reductor', 'trochanter_flexor')
                     if m not in mus or mus[m]['cells'] < 100]
          if missing:
              print(f'FAIL these muscle groups are missing or empty: {missing}')
              sys.exit(1)
          for name, row in mus.items():
              if abs(row['asym']) > 1.0001:
                  print(f'FAIL {name}: asymmetry {row["asym"]} cannot leave [-1, 1]')
                  sys.exit(1)
          lt, cra = mus['long_tendon']['asym'], mus['coxa_rotator_ant']['asym']
          if lt * cra >= 0:
              print(f'FAIL long_tendon ({lt:+.3f}) and coxa_rotator_ant '
                    f'({cra:+.3f}) are no longer opposed on the tripods')
              sys.exit(1)
          print(f'the muscle axis holds: long_tendon {lt:+.1%} against '
                f'coxa_rotator_ant {cra:+.1%}, {len(mus)} groups')
          PY

      - name: Pack the recorded world into the app bundle
        run: |
          python3 tools/pack_world.py
          ls -lh FlyBrain/World/

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project FlyBrain.xcodeproj

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run the test suite
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -1)
          test -n "$DEST" || { echo "no simulator available"; exit 1; }
          echo "testing on simulator $DEST"
          # `tee` and then read the result: a test that cannot find its asset
          # calls XCTSkip, and a suite of skips is a green tick over nothing.
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/tests.log
          python3 tools/check_tests.py build/tests.log

      - name: Build unsigned for device
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/FlyBrain.app"
          test -d "$APP" || { echo "no .app at $APP"; exit 1; }
          # The .app the *device* build wrote, and nothing else: a simulator
          # product would sit at Release-iphonesimulator, and shipping that
          # instead is one of the ways an .ipa installs nowhere.
          test -f "$APP/FlyBrain" || { echo "no executable in $APP"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # `ditto` is Apple's own archiver and keeps the permissions and the
          # resource forks the way the platform expects; `zip -r` does not
          # guarantee the executable bit inside the archive, and an .app whose
          # binary is not executable when it lands installs as a greyed-out
          # icon that never finishes. (`tools/audit_ipa.py` checks the mode in
          # the archive either way.)
          (cd build && ditto -c -k --sequesterRsrc --keepParent Payload \
             FlyBrain-unsigned.ipa)
          # The archive is written *inside* build/ by the subshell above, so the
          # path has to say so. The step that did not say so died here, after
          # `ditto` had already made a perfectly good .ipa — and a step that
          # dies here takes the two checks below it (does it carry its data, is
          # it installable-shaped) and the upload with it, so the run fails with
          # `ls: No such file or directory` and no artifact at all.
          IPA=build/FlyBrain-unsigned.ipa
          test -f "$IPA" || { echo "no .ipa at $IPA"; exit 1; }
          ls -lh "$IPA"

      - name: The .ipa must contain its data, and must not contain a recording
        run: |
          cd build
          for f in flybanc.bin flybanc_meta.json fly_anatomy.json; do
            unzip -l FlyBrain-unsigned.ipa | grep -q "FlyBrain.app/$f" \
              || { echo "$f is NOT in the .ipa"; exit 1; }
          done
          # The body asset, and the golden trace that pins the Swift solver to
          # the MuJoCo-verified Python one. Both are written into World/ by
          # tools/pack_body.py; a packer that deleted them again made a green
          # build whose Body screen had no skeleton and whose solver tests
          # skipped themselves, so they are demanded here, by name.
          # (One line per echo on purpose: a continuation inside a block
          # scalar that starts at column 1 ends the scalar and breaks the YAML.)
          for f in World/fly_body.json World/fly_golden.json; do
            unzip -l FlyBrain-unsigned.ipa | grep -q "FlyBrain.app/$f" || { echo "$f is NOT in the .ipa"; exit 1; }
          done
          # The world is what the Map button opens; an .ipa without it would
          # install and then explain itself instead of showing a fly.
          for f in world.json fly.bin; do
            unzip -l FlyBrain-unsigned.ipa | grep -qE \
              "FlyBrain.app/(World/)?$f$" \
              || { echo "$f is NOT in the .ipa - the world will not open"; \
                   exit 1; }
          done
          # And the recording must NOT be in it. The Map screen runs the
          # solver on the device; a build that ships frames.bin is a build that
          # can play it back instead, which is exactly what the .ipa on the
          # phone was doing.
          if unzip -l FlyBrain-unsigned.ipa | grep -qE \
               "FlyBrain.app/(World/)?frames\.bin$"; then
            echo "frames.bin IS in the .ipa - this build could play a recording"; \
            exit 1
          fi
          echo "the app carries its model and its connectome, and no recording"

      - name: The .ipa must be installable-shaped
        run: |
          # An .ipa can pass every scientific gate in this repository and still
          # be one nobody can install: the wrong slice, a binary that is not
          # executable inside the archive, a missing plist key, or the same
          # megabytes shipped twice. This reads the built product and fails on
          # any of them (and on a version number that does not match the build,
          # because the phone's screen prints it).
          VERSION=$(python3 - <<'PY'
          import re, pathlib
          y = pathlib.Path('project.yml').read_text()
          print(re.search(r'CFBundleShortVersionString: "([^"]+)"', y).group(1))
          PY
          )
          echo "this build is v$VERSION"
          python3 tools/audit_ipa.py build/FlyBrain-unsigned.ipa --expect-version "$VERSION"

      # The animal smells through its antennae, and the app reads the field at
      # the body model's head geom. If the body file names that mesh something
      # else, the app would read drive 0.00 forever — exactly what clean air
      # reads as, so nothing on the screen would say anything was wrong. The
      # names the app will try are in FlyWorld.odorParts, and this checks the
      # world it ships with actually has one of them. It is here, after the
      # world is packed into the bundle, rather than with the other step-4
      # checks: the file that matters is the packed one, and `world.json`'s geom
      # names are what `FlyWorld` puts on its nodes.
      - name: Step 4 — the animal must have a head to smell with
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          world = json.loads(pathlib.Path('FlyBrain/World/world.json').read_text())
          names = {g.get('name') for g in world['geoms']}
          src = pathlib.Path('FlyBrain/Sources/FlyWorld.swift').read_text()
          want = re.findall(r'static let odorParts = \[([^\]]+)\]', src)[0]
          want = [n.strip().strip('"') for n in want.split(',')]
          found = [n for n in want if n in names]
          if not found:
              print(f'FAIL none of the app\'s head names {want} is in the packed body '
                    f'({len(names)} geoms, e.g. {sorted(names)[:5]})')
              sys.exit(1)
          print(f'the app will smell at {found[0]!r} ({len(names)} geoms in the body)')
          PY

      - name: The manifest's part axis must be written, not counted
        run: |
          # Every renderer skips the parts with no mesh (the floor is part 0)
          # and indexes the recorded poses itself. If `part` is missing or is
          # not 0, 1, 2 … in manifest order, the animal is drawn with each mesh
          # wearing the pose of the part before it - which is what the app and
          # the browser viewer were both doing.
          cd build
          python3 - <<'PY'
          import json, sys, zipfile
          z = zipfile.ZipFile('FlyBrain-unsigned.ipa')
          name = next((n for n in z.namelist()
                       if n.endswith('World/world.json')), None)
          if name is None:
              sys.exit('world.json is not inside the .ipa')
          print(f'  reading {name} out of the built product')
          w = json.loads(z.read(name))
          g = w['geoms']
          parts = [x.get('part') for x in g]
          checks = [
              ('every geom carries a part index', all(p is not None for p in parts)),
              ('the indices are 0, 1, 2 … in manifest order',
               parts == list(range(len(parts)))),
              ('the recording has one row per part',
               w['frames']['parts'] == len(g)),
              ('the first part is the floor', g[0]['name'] == 'floor'
               and 'mesh' not in g[0]),
              ('every part after it has a mesh',
               all('mesh' in x for x in g[1:])),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          print(f"  {len(g)} parts, {w['frames']['n']} recorded frames")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-unsigned-ipa
          path: build/FlyBrain-unsigned.ipa
          if-no-files-found: error

      - name: Upload the step-1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step1-evidence
          path: |
            reports/step1_anatomy.md
            reports/step1_stand.json
            build/fly_anatomy.json
            build/fly_motorunits.json

      - name: Upload the step-2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step2-evidence
          path: |
            reports/step2_reflex.md
            reports/step2_reflex.json
            reports/step2_legcircuit.json

      - name: Upload the step-3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step3-evidence
          path: |
            reports/step3_closedloop.md
            reports/step3_closedloop.json
            docs/img/step3_loop.png

      - name: Upload the step-4 evidence and the world
        uses: actions/upload-artifact@v4
        with:
          name: step4-world
          path: |
            reports/step4_world.md
            reports/step4_world.json
            world/
