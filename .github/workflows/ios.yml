name: Build FlyBrain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS, Xcode)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python3 -m pip install --quiet numpy pandas pyarrow mujoco

      # ---------------------------------------------------------------- data
      - name: Cache BANC v888
        id: banc-cache
        uses: actions/cache@v4
        with:
          path: data/banc
          key: banc-888-v1

      - name: Download BANC v888 (brain + ventral nerve cord)
        if: steps.banc-cache.outputs.cache-hit != 'true'
        run: bash tools/download_banc.sh

      - name: Cache the flybody model
        id: flybody-cache
        uses: actions/cache@v4
        with:
          path: data/flybody
          key: flybody-main-v1

      - name: Download the flybody body model
        if: steps.flybody-cache.outputs.cache-hit != 'true'
        run: bash tools/download_flybody.sh

      # ------------------------------------------------------- step 1: body
      # The anatomy inventory is the ground truth every later step is written
      # against, so it runs BEFORE the app build and its failure fails the run.
      - name: Step 1 — anatomy inventory (body + nerve structure)
        run: python3 tools/step1_anatomy.py

      - name: Step 1 — assert the anatomy matches the published animal
        run: |
          python3 - <<'PY'
          import json, sys
          a = json.load(open('build/fly_anatomy.json'))
          c = a['counts']
          checks = [
              ('body parts',          c['parts'],              67),
              ('articulated joints',  c['joints_articulated'], 102),
              ('articulated DOF',     c['dof_articulated'],    102),
              ('actuators',           c['actuators'],          78),
              ('adhesion actuators',  sum(1 for x in a['actuators']
                                          if x['name'].startswith('adhere_')), 8),
          ]
          ok = True
          for label, got, want in checks:
              flag = 'ok ' if got == want else 'FAIL'
              if got != want: ok = False
              print(f'  {flag} {label:22s} {got}  (expected {want})')
          mass = a['mass_total_kg'] * 1e6
          if not (0.8 < mass < 1.2):
              print(f'  FAIL mass {mass:.3f} mg is not a fruit fly'); ok = False
          else:
              print(f'  ok  mass                   {mass:.3f} mg')
          length = a['size']['body_length_mm']
          if not (2.0 < length < 3.5):
              print(f'  FAIL trunk length {length:.2f} mm is not a fruit fly'); ok = False
          else:
              print(f'  ok  trunk length           {length:.2f} mm')
          sys.exit(0 if ok else 1)
          PY

      # ----------------------------------------------------- step 1: physics
      - name: Step 1 — the fly stands on its own six feet
        run: python3 tools/step1_sim.py --seconds 3.0 --json reports/step1_stand.json

      # -------------------------------------------------------------- the app
      - name: Build the connectome binary for the app
        run: |
          python3 tools/build_banc.py --raw data/banc --out build/flybanc.bin \
                                      --min-syn 3 --conduction-speed 0.25
          python3 tools/verify_banc.py --ms 120 --gain 12 --drive 1.5
          mkdir -p FlyBrain/Resources
          cp build/flybanc.bin build/flybanc_meta.json FlyBrain/Resources/
          cp build/fly_anatomy.json FlyBrain/Resources/
          ls -lh FlyBrain/Resources/

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project FlyBrain.xcodeproj

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run the test suite
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -1)
          test -n "$DEST" || { echo "no simulator available"; exit 1; }
          echo "testing on simulator $DEST"
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned for device
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/FlyBrain.app"
          test -d "$APP" || { echo "no .app at $APP"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry FlyBrain-unsigned.ipa Payload
          ls -lh FlyBrain-unsigned.ipa

      - name: The .ipa must contain its data
        run: |
          cd build
          for f in flybanc.bin flybanc_meta.json fly_anatomy.json; do
            unzip -l FlyBrain-unsigned.ipa | grep -q "FlyBrain.app/$f" \
              || { echo "$f is NOT in the .ipa"; exit 1; }
          done
          echo "all data assets present"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-unsigned-ipa
          path: build/FlyBrain-unsigned.ipa
          if-no-files-found: error

      - name: Upload the step-1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step1-evidence
          path: |
            reports/step1_anatomy.md
            reports/step1_stand.json
            build/fly_anatomy.json
            build/fly_motorunits.json
