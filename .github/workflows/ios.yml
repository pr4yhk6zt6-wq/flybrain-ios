name: Build FlyBrain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS, Xcode)
    runs-on: macos-15
    # Step 3 runs ~20 minutes of nerve cord and ~20 minutes of physics on top
    # of the build, because it is an experiment and not a unit test.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      # ---------------------------------------------------------------- data
      - name: Cache BANC v888
        id: banc-cache
        uses: actions/cache@v4
        with:
          path: data/banc
          key: banc-888-v1

      - name: Download BANC v888 (brain + ventral nerve cord)
        if: steps.banc-cache.outputs.cache-hit != 'true'
        run: bash tools/download_banc.sh

      - name: Cache the flybody model
        id: flybody-cache
        uses: actions/cache@v4
        with:
          path: data/flybody
          key: flybody-main-v1

      - name: Download the flybody body model
        if: steps.flybody-cache.outputs.cache-hit != 'true'
        run: bash tools/download_flybody.sh

      # ------------------------------------------------------- step 1: body
      # The anatomy inventory is the ground truth every later step is written
      # against, so it runs BEFORE the app build and its failure fails the run.
      - name: Step 1 — anatomy inventory (body + nerve structure)
        run: python3 tools/step1_anatomy.py

      - name: Step 1 — assert the anatomy matches the published animal
        run: |
          python3 - <<'PY'
          import json, sys
          a = json.load(open('build/fly_anatomy.json'))
          c = a['counts']
          checks = [
              ('body parts',          c['parts'],              67),
              ('articulated joints',  c['joints_articulated'], 102),
              ('articulated DOF',     c['dof_articulated'],    102),
              ('actuators',           c['actuators'],          78),
              ('adhesion actuators',  sum(1 for x in a['actuators']
                                          if x['name'].startswith('adhere_')), 8),
          ]
          ok = True
          for label, got, want in checks:
              flag = 'ok ' if got == want else 'FAIL'
              if got != want: ok = False
              print(f'  {flag} {label:22s} {got}  (expected {want})')
          mass = a['mass_total_kg'] * 1e6
          if not (0.8 < mass < 1.2):
              print(f'  FAIL mass {mass:.3f} mg is not a fruit fly'); ok = False
          else:
              print(f'  ok  mass                   {mass:.3f} mg')
          length = a['size']['body_length_mm']
          if not (2.0 < length < 3.5):
              print(f'  FAIL trunk length {length:.2f} mm is not a fruit fly'); ok = False
          else:
              print(f'  ok  trunk length           {length:.2f} mm')
          sys.exit(0 if ok else 1)
          PY

      # ----------------------------------------------------- step 1: physics
      - name: Step 1 — the fly stands on its own six feet
        run: python3 tools/step1_sim.py --seconds 3.0 --json reports/step1_stand.json

      # ------------------------------------------------------ step 2: reflex
      # The exact command docs/STEP2.md documents, so CI reproduces the numbers
      # the write-up quotes. The probe is report-only on the reflex DIRECTION —
      # that is state-dependent in the real animal too, and step 2 reports the
      # condition under which it flips rather than hiding it. It fails the build
      # only if the connectome stops containing the pathway, or if the corrected
      # sign regresses to the old, wrong one.
      - name: Step 2 — the leg reflex, out of the connectome
        run: |
          python3 tools/step2_legcircuit.py --leg front_leg --side left --hops 3
          python3 tools/step2_reflex.py --leg front_leg --side left --ms 700 --desc 2.5 --stim 3.0

      - name: Step 2 — the pathway must be present in the connectome
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open('reports/step2_reflex.json'))
          checks = [
              ('chordotonal organ found', r['organs'].get('chordotonal', 0) > 20),
              ('tibia flexor pool found', r['pools'].get('tibia flexor', 0) > 5),
              ('an arc exists out of the organ', len(r['chordotonal_arcs']) > 0),
              ('a disynaptic route to the flexor exists',
               r['disynaptic'].get('tibia flexor', {}).get('arcs', 0) > 0),
              ('the tibia routes are reached through interneurons',
               r['disynaptic'].get('tibia flexor', {}).get('interneurons', 0) > 0),
              # the bug behind commit 7b22dd1: the table was computed against
              # the wrong neurons and came out positive. Guard the corrected sign.
              ('the tibia flexor pathway is net inhibitory (corrected sign)',
               r['disynaptic']['tibia flexor']['net_weight'] < -20000),
              # published anatomy, reproduced in the connectome (docs/STEP2.md §2)
              ('no direct chordotonal path to a tibia motor neuron (Azevedo 2020)',
               r['monosynaptic']['chordotonal']['tibia flexor']['arcs'] == 0),
              ('a direct campaniform path to the flexor (Phelps 2021)',
               r['monosynaptic']['campaniform']['tibia flexor']['arcs'] >= 1),
              # the failure this step fixed: the network used to be silent
              ('the standing fly has an active nerve cord',
               r['runs']['standing']['_population_hz'] > 1.0),
              ('the answer is reported across scales, not at one',
               len(r['scale_sweep']) >= 2 and 'control_sign_shuffled' in r),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          top = r['chordotonal_arcs'][0]['cell']
          print(f"  strongest organ target: {top}")
          sys.exit(0 if ok else 1)
          PY

      # ------------------------------------------------------ step 3: the loop
      # The exact command docs/STEP3.md documents, so CI reproduces the numbers
      # the write-up quotes. It fails the build if the animal stops standing
      # with one leg under cord control. It does NOT assert the direction of
      # the reflex: that is the result, it is state-dependent in the real
      # animal, and step 2 already declined to claim it. What is asserted is
      # that the measurement exists, at more than one load, in both
      # directions, and across every parameter this step had to choose.
      - name: Step 3 — close the loop, cord to muscle to joint to sense organ
        run: |
          python3 tools/step3_closedloop.py --leg front_leg --side left \
                                            --plot docs/img/step3_loop.png

      - name: Step 3 — the loop must close, and the reflex must be measured
        run: |
          python3 - <<'PY'
          import json, sys

          r = json.load(open('reports/step3_closedloop.json'))
          s, idx, driven = r['standing'], r['reflex_index'], r['driven']
          loads = sorted({v['load_body_weights'] for v in idx.values()})
          dirs = sorted({v['direction'] for v in idx.values()})
          force = [v['force_ref'] for v in r['reference'].values()]

          # Two rows of the polarity control, identical in every respect except
          # the sign of one published biological fact. If they agree, the organ
          # is not reaching the loop and nothing below means anything.
          pol = list(r['polarity_control'].values())
          spread = sum(abs(pol[0][d]['reflex_index'] - pol[1][d]['reflex_index'])
                       for d in ('extension', 'flexion'))

          checks = [
              ('the animal stands with one leg under cord control',
               s['standing']),
              ('the body does not sink once it has settled',
               abs(s['com_z_mm_change_second_half']) < 0.10),
              ('most of the feet are still on the floor',
               s['foot_contacts_mean'] >= 4.0),
              ('every driven joint is commanded by both of its antagonists',
               all(driven[j]['+1'] and driven[j]['-1'] for j in driven)),
              ('the flexion and extension directions were measured, not assumed',
               all('flexion' in r['joints'][j] and 'extension' in r['joints'][j]
                   for j in driven)),
              ('the reflex is measured in both directions',
               dirs == ['extension', 'flexion']),
              ('the reflex is measured at more than one load', len(loads) >= 2),
              ('adding load actually loads the leg', max(force) > 1.5 * min(force)),
              ('the load question is asked again where the reflex is readable',
               len(r['reflex_index_at_switch_kappa']) >= 2),
              ('the organ gain is swept, not chosen', len(r['kappa_sweep']) >= 2),
              ('the muscle filter is swept, not chosen',
               len(r['tau_muscle_sweep']) >= 2),
              ('the polarity of the organ is tested, not assumed',
               len(r['polarity_control']) == 2),
              ('reversing that polarity changes what the loop does', spread > 0.02),
              ("step 2's synaptic scale is swept, not chosen",
               len(r['scale_sweep']) >= 2),
              ('every pool is either placed on a joint or listed as not driven',
               len(r['pool_placement']) + len(r['pools_not_driven']) >= 7),
          ]

          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)

          # What was measured. Deliberately no assertion about the *direction*
          # of the reflex: that is a finding, and a finding is not a test.
          for tag, block in (("kappa = 1", idx),
                             ("kappa = 4", r['reflex_index_at_switch_kappa'])):
              for v in block.values():
                  print(f"  {tag} {v['load_body_weights']:g} W "
                        f"{v['direction']:9s} rho {v['reflex_index']:+.3f} "
                        f"+- {v['reflex_index_sem']:.3f} ({v['verdict']}"
                        f"{'' if v['resolved'] else ', below the noise'})")
          for k, row in r['polarity_control'].items():
              print(f"  {k}: " + ", ".join(
                  f"{d} {row[d]['reflex_index']:+.3f}" for d in row))
          sys.exit(0 if ok else 1)
          PY

      # -------------------------------------------------------------- step 4
      # Steps 1 to 3 progressively handed the animal over to its own nervous
      # system. Step 4 drives all six legs and then does the thing the other
      # three could not: it lets you look at it. This runs a short recording
      # (the real one is minutes long) and asserts the recording exists and
      # that the animal is standing in it. It asserts nothing about whether
      # the animal walks: with six independent cords and no coordination
      # between them, the honest expectation is that it stands, and finding
      # out is the point of publishing the recording rather than a test.
      # The long recording, not a short one: reports/step4_world.md is
      # committed, and the world packed into the .ipa has to be the animal
      # the report describes — seven seconds, two pushes, 0.56 units of
      # travel — rather than a shorter run that quietly rewrites it.
      - name: Step 4 — the whole animal, six legs, in a world
        run: |
          python3 tools/step4_world.py --ms 7000 --pre-ms 600 \
            --nudge 2600 --nudge 5600 --nudge-force 0.6 --nudge-ms 120 \
            --seed 7

      - name: Step 4 — the recording must exist, and the animal must be in it
        run: |
          python3 - <<'PY'
          import json, sys, pathlib

          r = json.load(open('reports/step4_world.json'))
          b = r['behaviour']
          frames = pathlib.Path('world/frames.bin')
          body = pathlib.Path('world/fly.bin')
          npart = r['frames']['parts']

          checks = [
              ('all six legs are driven by their own cord', len(r['legs']) == 6),
              ('the animal is standing in the recording',
               b['foot_contacts_mean'] >= 4.0),
              ('it did not fall over', not b['fell_over']),
              ('the body geometry was written',
               body.exists() and body.stat().st_size > 1_000_000),
              ("the model's own meshes survived the packing",
               r['body_geometry']['n_face'] > 100_000),
              ('the recording has frames in it', r['frames']['n'] > 10),
              ('the frame file is exactly the size the manifest says',
               frames.stat().st_size
               == r['frames']['n'] * npart * 7 * 4),
              ('every visible part is posed in every frame', npart >= 60),
              ("the animal's stance was solved for all six legs at once",
               len(r['stance']['leg_force']) == 6),
              ("the world's push is recorded rather than hidden",
               len(r['model']['nudges_ms']) >= 1),
              ('every leg carries some of the weight',
               all(v > 0 for v in r['stance']['leg_force'].values())),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          print(f"  net displacement {b['net_displacement']:.4f} units "
                f"({b['net_displacement']/0.27:.2f} body lengths), "
                f"{b['foot_contacts_mean']:.1f} of 6 feet down, "
                f"fell over: {b['fell_over']}")
          sys.exit(0 if ok else 1)
          PY

      # ------------------------------------------------- step 5: the body, live
      # The solver the phone runs, written in NumPy first so it can be checked
      # against MuJoCo before a line of Swift exists. Three checks, and all
      # three have to pass: forward kinematics against mj_forward to 1e-15
      # (that one is a frame convention, not a tolerance question); twenty
      # milliseconds of free fall against MuJoCo stepping the same model with
      # the same 100 us integrator; and the animal standing for three seconds
      # on its own six feet, on muscles and a floor and nothing else.
      #
      # Then the golden trace, which is what the Swift port is pinned to. The
      # body asset is rebuilt first: a json field the solver reads is silently
      # inert when it is absent, so every number below is stale until it is.
      - name: Step 5 — rebuild the body asset
        run: |
          python3 tools/build_body.py --flybody data/flybody \
            --out build/fly_body.json --meshes build/fly_meshes.bin

      # The stance the phone uses is measured by *standing the animal up in the
      # solver the phone runs*: build_body.py reads it off MuJoCo's soft
      # contacts, and a stance is only a stance for the floor it was measured
      # on. This rewrites stance_q, stance_root_z and the stance excitation in
      # place, so everything after it — the checks, the golden trace, the app
      # bundle — is measured against the same animal the app will run.
      - name: Step 5 — measure the stance by standing in this solver
        run: python3 tools/stand_body.py --body build/fly_body.json --ms 600

      - name: Step 5 — the solver against MuJoCo, and the animal standing
        run: |
          python3 tools/fly_aba.py --verify \
            --mjcf data/flybody/flybody-main/flybody/fruitfly/assets/fruitfly.xml \
            --out reports/step5_aba.json

      - name: Step 5 — the golden trace the Swift solver must reproduce
        run: python3 tools/fly_aba.py --golden build/fly_golden.json

      - name: Step 5 — read the report and fail if anything is wrong with it
        run: |
          python3 - <<'PY'
          import json, sys

          r = json.load(open('reports/step5_aba.json'))
          k, d, st = r['kinematics'], r['dynamics'], r['standing']
          checks = [
              ('forward kinematics match mj_forward', k['ok']),
              ('the first step of free fall matches MuJoCo', d['ok']),
              ('body positions stay put in free fall', d['xpos'] < 1e-4),
              ('the centre of mass stays put in free fall', d['com'] < 1e-6),
              ('the animal stands on its own muscles', st['ok']),
              ('no joint ran away', st['worst_joint_rate'] < 60),
              ('the floor carries the animal weight',
               0.8 <= st['support_over_weight_last_half'] <= 1.2),
              ('the feet are down', st['feet_on_floor_mean'] >= 5.0),
              ('it does not sink or lift while it stands',
               st['com_z_sd_last_half'] < 0.01),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          print(f"  standing: COM z {st['com_z_first']:+.5f} -> "
                f"{st['com_z_last']:+.5f} cm, drift {st['drift_cm']:.4f} cm, "
                f"support/weight {st['support_over_weight_last_half']:.3f}")
          sys.exit(0 if ok else 1)
          PY

      # Every mesh the app draws is positioned by the asset's own `visual`
      # table. This checks that table against the model it was read out of —
      # `pos`, `quat`, and which body each part belongs to — because the screen
      # is the only place a mistake in it would otherwise show up.
      - name: Step 5 — every drawn part must sit where the model puts it
        run: python3 tools/audit_meshes.py

      - name: Step 5 — pack the body into the app bundle
        run: |
          rm -f FlyBrain/World/fly_body.json
          python3 tools/pack_body.py
          ls -lh FlyBrain/World/

      # -------------------------------------------------------------- the app
      - name: Build the connectome binary for the app
        run: |
          python3 tools/build_banc.py --raw data/banc --out build/flybanc.bin \
                                      --min-syn 3 --conduction-speed 0.25
          python3 tools/verify_banc.py --ms 120 --gain 12 --drive 1.5
          # The app has to run at the operating point that was measured, and
          # the two numbers live in different languages — so the one that can
          # be checked is checked here rather than trusted.
          grep -q 'var gain: Float = 12' FlyBrain/Sources/SimulationEngine.swift \
            || { echo "the app's default synaptic gain is not the 12 CI validates at"; exit 1; }
          mkdir -p FlyBrain/Resources
          cp build/flybanc.bin build/flybanc_meta.json FlyBrain/Resources/
          cp build/fly_anatomy.json FlyBrain/Resources/
          ls -lh FlyBrain/Resources/

      # Everything above built the brain. This puts the body in: the app
      # bundle is only allowed to carry what existed when xcodegen ran, so
      # the recording has to be copied in first.
      # Step 6 reads the motor pools out of the connectome as named groups, so
      # the check they are actually in the built file belongs here, next to the
      # build that puts them there -- not in the app, where a missing pool is
      # an animal that does nothing.
      # The Shader file is the one place in the app that CI can read but not
      # run, so the two numbers the kernel's own header claims are checked by
      # name: external input is added raw, and the retina scales the camera path
      # only. Both are also measured against the Python reference by
      # tools/pool_probe.py (docs/ASSUMPTIONS.md #25).
      - name: Step 6 — the LIF kernel's external-input convention must match the reference
        run: |
          grep -q 'iSyn \* P.gain + externalInput\[gid\] + noise' FlyBrain/Shaders/LIF.metal \
            || { echo "lifIntegrate is not adding the external drive raw (ASSUMPTIONS #25)"; exit 1; }
          grep -q 'clamp(P.cameraBias + contrast, 0.0f, 4.0f)' FlyBrain/Shaders/LIF.metal \
            || { echo "the retina's documented [0,4] clamp is gone (ASSUMPTIONS #15)"; exit 1; }

      # The group tallies are the one counter that accumulates across a whole
      # frame while the harvest that reads them runs after the GPU is done. That
      # is an ordering claim, and only a dispatch inside the same command buffer
      # can make it: the memset this gate forbids ran at *encode* time, which is
      # not the time the GPU reaches the kernels, so a device that keeps its
      # queue a few frames deep can throw a frame's tallies away before anything
      # reads them. Both halves are pinned because either one alone is a bug.
      - name: Step 6 — the group tallies must be cleared on the GPU, not the CPU
        run: |
          grep -q 'if (zeroGroups != 0 && gid < groupCount) groupCounts\[gid\] = 0;' \
            FlyBrain/Shaders/LIF.metal \
            || { echo "resetCounters no longer clears the group tallies on the GPU"; exit 1; }
          if grep -q 'memset(groupCounts' FlyBrain/Sources/SimulationEngine.swift; then
            echo "SimulationEngine is clearing groupCounts from the CPU again: that"
            echo "write lands at encode time and races the GPU's accumulation."
            exit 1
          fi

      # Item 4 is the walking circuits, and it has a substrate in the dataset:
      # 788 cells in BANC v888 synapse onto the motor pools of more than one
      # leg (69,543 synapses into them), while the sense organs' own route to
      # the pools is 85:1 private to the leg it serves (this same tool's first
      # section). A gait built on the cord therefore needs those cells to still
      # be there in the packed binary — this is the gate that says so.
      - name: Step 6 — the connectome must couple the legs beyond the sense organs
        run: python3 tools/coupling_probe.py --structural-only --require-coupling

      - name: Step 6 — the motor pools must be in the connectome
        run: python3 tools/verify_pools.py

      # The loop the app closes has two ends, generated by two different tools:
      # the muscles in the body asset (build_body.py) and the pools and organs
      # in the connectome (build_banc.py). Both are asked for *by name*. This is
      # the check that they are the same names, on the files the app will carry.
      - name: Step 6 — both ends of the loop must exist, and by the same names
        run: python3 tools/verify_loop.py

      # The tone the cord runs on is the brain's, and FlyCord puts it on the
      # descending population — where tools/step3_closedloop.py puts it. That is
      # only a wiring claim until it is measured in the binary the app carries:
      # the descending cells have to synapse onto the motor neurons the pool
      # groups are made of, leg by leg. Reads build/flybanc.bin.
      - name: Step 6 — the descending cells must reach the legs' motor pools
        run: python3 tools/verify_descending.py

      # The loop exists three times — the step-3 reference, the walk loop with
      # the body in it, and FlyCord.swift, which is what the animal runs. Three
      # transliterations of one law drift, and the drift is invisible: it has
      # already happened twice (the pool names, and the four-times-too-small
      # rates). This is the method that replaces reading two files side by side
      # — it reads the constants out of all three files and fails on any
      # disagreement, and it fails if either organ law stops naming its κ.
      - name: Step 6 — the cord's laws must be one set of numbers in all three files
        run: python3 tools/check_cord_laws.py --explain

      - name: Pack the recorded world into the app bundle
        run: |
          python3 tools/pack_world.py
          ls -lh FlyBrain/World/

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project FlyBrain.xcodeproj

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run the test suite
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -1)
          test -n "$DEST" || { echo "no simulator available"; exit 1; }
          echo "testing on simulator $DEST"
          # `tee` and then read the result: a test that cannot find its asset
          # calls XCTSkip, and a suite of skips is a green tick over nothing.
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/tests.log
          python3 tools/check_tests.py build/tests.log

      - name: Build unsigned for device
        run: |
          set -o pipefail
          xcodebuild \
            -project FlyBrain.xcodeproj \
            -scheme FlyBrain \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/FlyBrain.app"
          test -d "$APP" || { echo "no .app at $APP"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry FlyBrain-unsigned.ipa Payload
          ls -lh FlyBrain-unsigned.ipa

      - name: The .ipa must contain its data, and must not contain a recording
        run: |
          cd build
          for f in flybanc.bin flybanc_meta.json fly_anatomy.json; do
            unzip -l FlyBrain-unsigned.ipa | grep -q "FlyBrain.app/$f" \
              || { echo "$f is NOT in the .ipa"; exit 1; }
          done
          # The body asset, and the golden trace that pins the Swift solver to
          # the MuJoCo-verified Python one. Both are written into World/ by
          # tools/pack_body.py; a packer that deleted them again made a green
          # build whose Body screen had no skeleton and whose solver tests
          # skipped themselves, so they are demanded here, by name.
          # (One line per echo on purpose: a continuation inside a block
          # scalar that starts at column 1 ends the scalar and breaks the YAML.)
          for f in World/fly_body.json World/fly_golden.json; do
            unzip -l FlyBrain-unsigned.ipa | grep -q "FlyBrain.app/$f" || { echo "$f is NOT in the .ipa"; exit 1; }
          done
          # The world is what the Map button opens; an .ipa without it would
          # install and then explain itself instead of showing a fly.
          for f in world.json fly.bin; do
            unzip -l FlyBrain-unsigned.ipa | grep -qE \
              "FlyBrain.app/(World/)?$f$" \
              || { echo "$f is NOT in the .ipa - the world will not open"; \
                   exit 1; }
          done
          # And the recording must NOT be in it. The Map screen runs the
          # solver on the device; a build that ships frames.bin is a build that
          # can play it back instead, which is exactly what the .ipa on the
          # phone was doing.
          if unzip -l FlyBrain-unsigned.ipa | grep -qE \
               "FlyBrain.app/(World/)?frames\.bin$"; then
            echo "frames.bin IS in the .ipa - this build could play a recording"; \
            exit 1
          fi
          echo "the app carries its model and its connectome, and no recording"

      - name: The manifest's part axis must be written, not counted
        run: |
          # Every renderer skips the parts with no mesh (the floor is part 0)
          # and indexes the recorded poses itself. If `part` is missing or is
          # not 0, 1, 2 … in manifest order, the animal is drawn with each mesh
          # wearing the pose of the part before it - which is what the app and
          # the browser viewer were both doing.
          cd build
          python3 - <<'PY'
          import json, sys, zipfile
          z = zipfile.ZipFile('FlyBrain-unsigned.ipa')
          name = next((n for n in z.namelist()
                       if n.endswith('World/world.json')), None)
          if name is None:
              sys.exit('world.json is not inside the .ipa')
          print(f'  reading {name} out of the built product')
          w = json.loads(z.read(name))
          g = w['geoms']
          parts = [x.get('part') for x in g]
          checks = [
              ('every geom carries a part index', all(p is not None for p in parts)),
              ('the indices are 0, 1, 2 … in manifest order',
               parts == list(range(len(parts)))),
              ('the recording has one row per part',
               w['frames']['parts'] == len(g)),
              ('the first part is the floor', g[0]['name'] == 'floor'
               and 'mesh' not in g[0]),
              ('every part after it has a mesh',
               all('mesh' in x for x in g[1:])),
          ]
          ok = True
          for label, cond in checks:
              print(f"  {'ok  ' if cond else 'FAIL'} {label}")
              ok &= bool(cond)
          print(f"  {len(g)} parts, {w['frames']['n']} recorded frames")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-unsigned-ipa
          path: build/FlyBrain-unsigned.ipa
          if-no-files-found: error

      - name: Upload the step-1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step1-evidence
          path: |
            reports/step1_anatomy.md
            reports/step1_stand.json
            build/fly_anatomy.json
            build/fly_motorunits.json

      - name: Upload the step-2 evidence
